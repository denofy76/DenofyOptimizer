<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0b0f14">
    <title>DenofyOptimizer</title>
    <link rel="icon" href="logo3.ico" type="image/x-icon">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { background: #0b0f14; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            /* Новый фон с радиальными градиентами */
            background: radial-gradient(circle at 20% 20%, rgba(46,160,67,0.08), transparent 40%),
                        radial-gradient(circle at 80% 80%, rgba(111,221,140,0.06), transparent 40%),
                        #0b0f14;
            color: #e6edf3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            padding-top: calc(20px + env(safe-area-inset-top, 0px));
            position: relative;
            font-size: 16px;
            line-height: 1.5;
        }

        /* Фон с частицами */
        #particlesCanvas {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            opacity: 0.6;
        }

        body.loading .container,
        body.loading .top-bar {
            opacity: 0;
            pointer-events: none;
        }

        /* Splash screen (фон затемнён) */
        .splash-screen {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: #0b0f14; z-index: 100;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            opacity: 1; transition: opacity 0.6s ease; pointer-events: all;
            padding: 20px;
            padding-top: calc(20px + env(safe-area-inset-top, 0px));
            padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
        }
        .splash-screen.hide { opacity: 0; pointer-events: none; }

        .splash-logo-img { 
            width: 150px;
            height: auto;
            animation: splashPulse 1.5s ease infinite; 
            margin-bottom: 16px; 
            filter: drop-shadow(0 0 20px rgba(46, 160, 67, 0.5));
        }

        @keyframes splashPulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        .splash-text {
            font-size: 1.4rem; font-weight: 600; letter-spacing: 0.2em;
            color: #2ea043; margin-bottom: 30px; animation: splashFadeText 1.5s ease infinite;
            word-break: break-word; text-align: center;
            text-shadow: 0 0 15px rgba(46, 160, 67, 0.6);
            line-height: 1.3;
        }

        @keyframes splashFadeText {
            0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; }
        }

        .splash-progress {
            width: 200px; height: 4px; background: rgba(255,255,255,0.15);
            border-radius: 2px; overflow: hidden;
        }
        .splash-progress-bar {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, #2ea043, #6fdd8c);
            border-radius: 2px;
            animation: progressGrow 1.8s ease forwards;
        }
        @keyframes progressGrow { 0% { width: 0%; } 100% { width: 100%; } }

        /* Контейнер (чуть темнее) */
        .container {
            opacity: 0;
            transform: translateY(40px);
            transition: opacity 0.8s ease-out, transform 0.8s cubic-bezier(0.22, 0.61, 0.36, 1);
            will-change: transform, opacity;
            background: rgba(22, 27, 34, 0.75);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(48, 54, 61, 0.6); border-radius: 24px;
            padding: 40px; max-width: 900px; width: 100%; margin-top: 60px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(46, 160, 67, 0.15);
        }
        body.loaded .container {
            opacity: 1;
            transform: translateY(0);
        }

        /* Верхняя панель (темнее) */
        .top-bar {
            position: fixed; top: 22px; left: 28px; right: 28px; z-index: 10;
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo {
            display: flex; align-items: center;
            background: rgba(13, 17, 23, 0.7);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(46, 160, 67, 0.25); border-radius: 14px;
            padding: 10px; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5);
            transition: all 0.25s ease; text-decoration: none; cursor: pointer; user-select: none;
        }
        .logo:hover {
            background: rgba(13, 17, 23, 0.85); border-color: #2ea043;
            box-shadow: 0 0 20px rgba(46, 160, 67, 0.3); transform: translateY(-1px);
        }
        .logo-img { height: 44px; width: auto; display: block; pointer-events: none; }

        .lang-switcher {
            display: flex; gap: 8px;
        }
        .lang-btn {
            background: rgba(13, 17, 23, 0.7);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(46, 160, 67, 0.25);
            color: #8b949e;
            font-weight: 600; font-size: 0.9rem; padding: 10px 18px;
            border-radius: 12px;
            cursor: pointer; transition: all 0.2s; letter-spacing: 0.3px;
        }
        .lang-btn.active {
            background: #2ea043;
            border-color: #2ea043;
            color: #ffffff;
            box-shadow: 0 0 12px rgba(46, 160, 67, 0.4);
        }
        .lang-btn:hover:not(.active) {
            background: rgba(255, 255, 255, 0.05);
            color: #c9d1d9;
        }

        .main-title {
            text-align: center;
            margin-bottom: 15px;
        }
        .main-title h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 2px;
            color: #ffffff;
        }
        .main-title .subtitle {
            font-size: 1rem;
            color: #8b949e;
        }

        .tabs {
            display: flex; 
            gap: 12px; 
            margin-bottom: 35px;
            border-bottom: 2px solid rgba(48, 54, 61, 0.8); 
            padding-bottom: 15px; 
            flex-wrap: wrap;
            justify-content: center;
        }
        .tab-btn {
            background: transparent; border: none; color: #8b949e;
            font-size: 1rem; font-weight: 600; padding: 10px 20px;
            border-radius: 10px 10px 0 0; cursor: pointer;
            position: relative; letter-spacing: 0.3px; white-space: nowrap;
            transition: color 0.25s ease, background 0.25s ease;
        }
        .tab-btn:hover { color: #c9d1d9; background: rgba(255, 255, 255, 0.03); }
        .tab-btn.active { color: #ffffff; background: rgba(46, 160, 67, 0.12); }
        .tab-btn.active::after {
            content: ''; position: absolute; bottom: -17px; left: 10%; right: 10%;
            height: 3px; background: linear-gradient(90deg, #2ea043, #6fdd8c);
            border-radius: 3px 3px 0 0; box-shadow: 0 0 12px rgba(46, 160, 67, 0.5);
        }
        .tab-btn:focus-visible {
            outline: 2px solid #2ea043;
            outline-offset: -2px;
        }
        :focus-visible {
            outline: 2px solid #2ea043;
            outline-offset: 2px;
        }

        .tab-content {
            display: none;
            animation: fadeSlide 0.4s ease-out;
            min-height: 450px;
        }
        .tab-content.active { display: block; }
        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .btn {
            display: inline-block; background: #2ea043; color: #ffffff;
            font-weight: 600; font-size: 1rem; padding: 12px 32px;
            border-radius: 10px; text-decoration: none;
            transition: all 0.25s ease; border: 1px solid #3fb950;
            box-shadow: 0 4px 12px rgba(46, 160, 67, 0.3);
            letter-spacing: 0.3px; cursor: pointer;
        }
        .btn:hover { background: #3fb950; transform: translateY(-2px); box-shadow: 0 8px 25px rgba(46, 160, 67, 0.6); }
        .btn-outline { background: transparent; border: 1px solid #2ea043; color: #2ea043; box-shadow: 0 4px 12px rgba(46, 160, 67, 0.2); }
        .btn-outline:hover { background: rgba(46, 160, 67, 0.1); box-shadow: 0 8px 25px rgba(46, 160, 67, 0.5); transform: translateY(-2px); }
        .btn-disabled { background: #30363d; border-color: #484f58; color: #8b949e; cursor: not-allowed; pointer-events: none; box-shadow: none; }

        .package-cards { 
            display: flex; 
            gap: 20px; 
            margin: 30px 0 10px; 
            flex-wrap: nowrap;
            overflow: visible;
            padding: 10px 5px;
        }
        .package-card {
            flex: 1 1 200px;
            min-width: 180px;
            background: rgba(26, 31, 38, 0.92);
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            border: 1px solid rgba(48, 54, 61, 0.7);
            border-radius: 16px;
            padding: 24px 18px;
            text-align: center;
            transition: transform 0.3s ease, border-color 0.3s, box-shadow 0.3s;
            box-shadow: 0 6px 18px rgba(0,0,0,0.4);
            display: flex; flex-direction: column; align-items: center; gap: 10px;
            position: relative;
            z-index: 1;
            will-change: transform;
        }
        .package-card:hover {
            transform: translateY(-4px);
            border: 2px solid #2ea043;
            box-shadow: 0 12px 30px rgba(0,0,0,0.6), 0 0 15px rgba(46,160,67,0.5);
            z-index: 2;
        }
        .package-icon { font-size: 2.4rem; }
        .package-name { 
            font-weight: 700; font-size: 1.1rem; color: #f0f6fc;
            height: 2.5em;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }
        .package-desc { 
            font-size: 0.85rem; 
            color: #8b949e; 
            line-height: 1.4; 
            height: 3em;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }
        .package-size { font-size: 0.8rem; color: #6e7681; margin-top: -2px; }
        .package-card .btn { margin-top: auto; }

        .compare-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            margin: 30px auto;
            overflow: hidden;
            border-radius: 16px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.5);
            user-select: none;
        }
        .compare-container img {
            display: block;
            width: 100%;
            height: auto;
            pointer-events: none;
        }
        .img-before {
            position: absolute;
            top: 0;
            left: 0;
            clip-path: inset(0 50% 0 0);
        }
        .compare-slider {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 4px;
            background: #2ea043;
            left: 50%;
            transform: translateX(-50%);
            cursor: ew-resize;
            box-shadow: 0 0 15px rgba(46,160,67,0.6);
            z-index: 2;
        }
        .compare-slider::after {
            content: "◀ ▶";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #0b0f14;
            color: #2ea043;
            font-weight: bold;
            font-size: 1.2rem;
            padding: 6px 14px;
            border-radius: 20px;
            white-space: nowrap;
            box-shadow: 0 0 10px rgba(0,0,0,0.6);
        }
        .compare-label {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.7);
            color: #fff;
            padding: 4px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            pointer-events: none;
            z-index: 3;
        }
        .label-before { left: 15px; }
        .label-after  { right: 15px; }

        .links-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 18px; margin-top: 25px; }
        .social-link {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            padding: 14px 18px;
            background: rgba(26, 31, 38, 0.85);
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            border: 1px solid rgba(48, 54, 61, 0.7);
            border-radius: 14px;
            color: #e6edf3; text-decoration: none; font-weight: 600; font-size: 0.95rem;
            transition: all 0.25s ease;
        }
        .social-link:hover { background: rgba(46, 160, 67, 0.08); border-color: #2ea043; transform: translateY(-3px); box-shadow: 0 8px 20px rgba(46, 160, 67, 0.3); }
        .social-link .emoji { font-size: 1.3rem; }

        .action-buttons {
            display: flex;
            gap: 16px;
            margin-top: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .share-btn, .donate-btn {
            display: inline-flex; align-items: center; gap: 8px;
            font-weight: 600; font-size: 0.9rem; padding: 8px 16px;
            border-radius: 10px; cursor: pointer; transition: all 0.2s;
        }
        .share-btn {
            background: rgba(46, 160, 67, 0.1); border: 1px solid rgba(46, 160, 67, 0.3);
            color: #2ea043;
        }
        .share-btn:hover { background: rgba(46, 160, 67, 0.2); box-shadow: 0 4px 15px rgba(46, 160, 67, 0.4); }
        .donate-btn {
            background: rgba(255, 215, 0, 0.1); border: 1px solid rgba(255, 215, 0, 0.3);
            color: #ffd700;
        }
        .donate-btn:hover { background: rgba(255, 215, 0, 0.2); box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4); }

        .share-modal {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(6px);
            display: flex; justify-content: center; align-items: center;
            z-index: 20; opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .share-modal.active { opacity: 1; pointer-events: auto; }
        .share-dialog {
            background: rgba(22, 27, 34, 0.95);
            border: 1px solid rgba(46, 160, 67, 0.4);
            border-radius: 20px; padding: 24px; max-width: 360px; width: 90%;
        }
        .share-option {
            display: block; width: 100%; text-align: left;
            background: rgba(255,255,255,0.05); border: none; color: #e6edf3;
            padding: 12px; border-radius: 10px; margin-bottom: 8px;
            cursor: pointer; transition: background 0.2s;
        }
        .share-option:hover { background: rgba(46, 160, 67, 0.15); }

        .snake-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(10px);
            z-index: 30; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.4s;
        }
        .snake-overlay.active { opacity: 1; pointer-events: auto; }
        .snake-overlay canvas {
            border: 2px solid rgba(46, 160, 67, 0.4); border-radius: 12px;
            box-shadow: 0 0 30px rgba(46, 160, 67, 0.3); max-width: 95vw; max-height: 80vh;
        }
        .snake-close, .snake-restart {
            margin-top: 20px; background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2); color: #fff;
            padding: 10px 24px; border-radius: 10px; cursor: pointer; font-weight: 600;
            display: inline-block; margin-right: 10px;
        }

        @media (max-width: 700px) {
            body { padding: 12px; padding-top: calc(12px + env(safe-area-inset-top, 0px)); }
            .top-bar { top: 12px; left: 12px; right: 12px; flex-wrap: wrap; gap: 8px; }
            .logo { padding: 8px; } .logo-img { height: 36px; }
            .lang-btn { font-size: 0.8rem; padding: 8px 14px; }
            .container { margin-top: 90px; padding: 24px 16px; border-radius: 20px; }
            .main-title h1 { font-size: 1.6rem; }
            .main-title .subtitle { font-size: 0.9rem; }
            .tabs { 
                flex-direction: column; 
                gap: 8px; 
                margin-bottom: 24px; 
                padding-bottom: 12px; 
                border-bottom: 2px solid rgba(48, 54, 61, 0.8); 
                justify-content: flex-start;
            }
            .tab-btn {
                width: 100%; text-align: center; padding: 14px 20px; font-size: 1rem;
                border-radius: 12px; border: 1px solid rgba(48, 54, 61, 0.5);
            }
            .tab-btn.active { background: rgba(46, 160, 67, 0.15); border-color: #2ea043; }
            .tab-btn.active::after { display: none; }
            .tab-content { min-height: 350px; }
            .package-cards { flex-wrap: wrap; overflow-x: auto; }
            .package-card { flex: 1 1 250px; padding: 24px 16px; }
            .package-icon { font-size: 2.4rem; } .package-name { font-size: 1.1rem; } .package-desc { font-size: 0.85rem; }
            .btn { width: 100%; text-align: center; padding: 14px 24px; }
            .links-grid { grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
            .social-link { font-size: 0.85rem; padding: 12px 14px; }
            h2 { font-size: 1.5rem !important; }
            .action-buttons { flex-direction: column; gap: 10px; }
            .share-btn, .donate-btn { width: 100%; justify-content: center; padding: 12px 16px; }

            .splash-screen {
                padding: 15px;
                padding-top: calc(15px + env(safe-area-inset-top, 0px));
                padding-bottom: calc(15px + env(safe-area-inset-bottom, 0px));
            }
            .splash-logo-img { width: 110px; margin-bottom: 12px; filter: drop-shadow(0 0 25px rgba(46, 160, 67, 0.7)); }
            .splash-text { font-size: 1.5rem; letter-spacing: 0.15em; margin-bottom: 30px; padding: 0 10px; text-shadow: 0 0 20px rgba(46, 160, 67, 0.8); }
            .splash-progress { width: 180px; height: 5px; background: rgba(255,255,255,0.2); }
        }
    </style>
</head>
<body class="loading">

    <!-- Фон с частицами -->
    <canvas id="particlesCanvas"></canvas>

    <div class="splash-screen" id="splashScreen">
        <img class="splash-logo-img" src="logo2.png" alt="Denofy Logo" loading="lazy">
        <div class="splash-text">СДЕЛАНО DENOFY</div>
        <div class="splash-progress"><div class="splash-progress-bar"></div></div>
    </div>

    <!-- Верхняя панель -->
    <div class="top-bar">
        <a href="#" class="logo" id="logo">
            <img src="logo.png" alt="DenofyOptimizer" class="logo-img" loading="lazy">
        </a>
        <div class="lang-switcher">
            <button class="lang-btn active" data-lang="ru">RU</button>
            <button class="lang-btn" data-lang="en">EN</button>
        </div>
    </div>

    <!-- Основной контейнер -->
    <div class="container">
        <div class="main-title">
            <h1>DenofyOptimizer</h1>
            <div class="subtitle" data-i18n="optimization_desc">Оптимизация Windows 11</div>
        </div>

        <div class="tabs" id="tabsContainer">
            <button class="tab-btn active" data-tab="download-pack" data-i18n="tab_download">📦 Скачать пак</button>
            <button class="tab-btn" data-tab="download-app" data-i18n="tab_app">💻 Программа</button>
            <button class="tab-btn" data-tab="tests" data-i18n="tab_tests">⚡ Тесты</button>
            <button class="tab-btn" data-tab="updates" data-i18n="tab_updates">📝 Обновления</button>
            <button class="tab-btn" data-tab="about-author" data-i18n="tab_author">👤 Автор</button>
        </div>

        <!-- Вкладки (весь остальной HTML-код без изменений) -->
        <!-- ... -->
    </div>

    <!-- Модалки, змейка и т.д. (без изменений) -->
    <!-- ... -->

    <script>
        // ===== ЧАСТИЦЫ (новый фон) =====
        (function() {
            const canvas = document.getElementById('particlesCanvas');
            const ctx = canvas.getContext('2d');
            let w, h, particles = [];
            function resize() {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();
            for (let i = 0; i < 50; i++) {
                particles.push({
                    x: Math.random() * w,
                    y: Math.random() * h,
                    r: Math.random() * 2 + 0.5,
                    speed: Math.random() * 0.5 + 0.2
                });
            }
            function draw() {
                ctx.clearRect(0, 0, w, h);
                ctx.fillStyle = '#2ea043';
                particles.forEach(p => {
                    p.y += p.speed;
                    if (p.y > h) { p.y = 0; p.x = Math.random() * w; }
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fill();
                });
                requestAnimationFrame(draw);
            }
            draw();
        })();

        // ===== ЗАСТАВКА =====
        window.addEventListener('DOMContentLoaded', () => {
            const splash = document.getElementById('splashScreen');
            const body = document.body;
            setTimeout(() => {
                splash.classList.add('hide');
                body.classList.remove('loading');
                body.classList.add('loaded');
                setTimeout(() => { if (splash.parentNode) splash.remove(); }, 600);
            }, 1500);

            // ... весь остальной JavaScript (слайдер, табы, язык, шэринг, змейка, фид) ...
            // (вставь сюда весь JS из предоставленного кода)
        });

        // ... остальные функции ...
    </script>
</body>
</html>
