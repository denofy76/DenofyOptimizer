<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DenofyOptimizer</title>

<style>
body{
    margin:0;
    font-family:system-ui;
    background:#0b0f14;
    color:#e6edf3;
}

.topbar{
    position:fixed;
    top:0;left:0;right:0;
    display:flex;
    justify-content:space-between;
    padding:12px 18px;
    background:rgba(0,0,0,0.6);
    backdrop-filter:blur(12px);
    z-index:10;
}

.logo{font-weight:700;cursor:pointer;}

.container{
    max-width:1000px;
    margin:100px auto;
    padding:20px;
}

/* TABS */
.tabs{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.tab{
    padding:8px 12px;
    border:1px solid #2a2f3a;
    border-radius:8px;
    cursor:pointer;
    color:#8b949e;
}

.tab.active{
    border-color:#2ea043;
    color:#fff;
}

/* SECTIONS */
.section{display:none;margin-top:20px;}
.section.active{display:block;}

/* CARDS */
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:12px;
}

.card{
    padding:16px;
    border:1px solid #2a2f3a;
    border-radius:12px;
    background:#111823;
}

.btn{
    display:inline-block;
    margin-top:10px;
    padding:8px 12px;
    background:#2ea043;
    color:#fff;
    border-radius:8px;
    text-decoration:none;
}

/* COMPARE */
.compare{
    position:relative;
    max-width:700px;
    margin:20px auto;
    overflow:hidden;
}

.compare img{width:100%;display:block;}

.before{
    position:absolute;
    top:0;left:0;
    width:50%;
    overflow:hidden;
}

.slider{
    position:absolute;
    top:0;bottom:0;
    left:50%;
    width:3px;
    background:#2ea043;
    cursor:ew-resize;
}

/* MODAL */
.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.6);
    display:none;
    justify-content:center;
    align-items:center;
}

.modal.active{display:flex;}

.box{
    background:#111823;
    padding:20px;
    border-radius:12px;
}

/* SNAKE */
.snake{
    position:fixed;
    inset:0;
    display:none;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    background:rgba(0,0,0,0.85);
}

canvas{
    background:#000;
    border:1px solid #2ea043;
}
</style>
</head>

<body>

<div class="topbar">
<div class="logo" id="logo">DenofyOptimizer</div>
<div id="langBtn">RU / EN</div>
</div>

<div class="container">

<div class="tabs">
<div class="tab active" data-tab="home">📦 Пак</div>
<div class="tab" data-tab="test">⚡ Тесты</div>
<div class="tab" data-tab="updates">📝 Обновления</div>
<div class="tab" data-tab="author">👤 Автор</div>
</div>

<!-- HOME -->
<div class="section active" id="home">
<div class="grid">
<div class="card">
<h3>Optimizer Pack</h3>
<p>Основной набор оптимизации Windows</p>
<a class="btn" href="#">Скачать</a>
</div>

<div class="card">
<h3>ReviOS Pack</h3>
<p>Максимальная производительность</p>
<a class="btn" href="#">Скачать</a>
</div>
</div>
</div>

<!-- TEST -->
<div class="section" id="test">

<h3>До / После</h3>

<div class="compare" id="compare">
<img src="after.png">
<div class="before" id="before">
<img src="before.png">
</div>
<div class="slider" id="slider"></div>
</div>

</div>

<!-- UPDATES -->
<div class="section" id="updates">
<p>Обновления Telegram...</p>
</div>

<!-- AUTHOR -->
<div class="section" id="author">
<p>GitHub / VK / Steam</p>
</div>

</div>

<!-- MODAL -->
<div class="modal" id="modal">
<div class="box">
<p>Поделиться</p>
<button onclick="closeModal()">Закрыть</button>
</div>
</div>

<!-- SNAKE -->
<div class="snake" id="snake">
<canvas width="400" height="400"></canvas>
<button onclick="closeSnake()">Закрыть</button>
</div>

<script>
/* ========= TABS ========= */
document.querySelectorAll(".tab").forEach(t=>{
t.onclick=()=>{
document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
t.classList.add("active");

document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
document.getElementById(t.dataset.tab).classList.add("active");
}
});

/* ========= COMPARE ========= */
const before=document.getElementById("before");
const slider=document.getElementById("slider");
const compare=document.getElementById("compare");

let drag=false;

slider.onmousedown=()=>drag=true;
window.onmouseup=()=>drag=false;

window.onmousemove=(e)=>{
if(!drag)return;
let r=compare.getBoundingClientRect();
let x=(e.clientX-r.left)/r.width*100;
x=Math.max(0,Math.min(100,x));
before.style.width=x+"%";
slider.style.left=x+"%";
};

/* ========= MODAL ========= */
function openModal(){document.getElementById("modal").classList.add("active")}
function closeModal(){document.getElementById("modal").classList.remove("active")}

/* ========= SNAKE EASTER EGG ========= */
let clicks=0;
document.getElementById("logo").onclick=()=>{
clicks++;
setTimeout(()=>clicks=0,800);
if(clicks>=5) startSnake();
};

/* ========= SNAKE ========= */
let snake,dir,food,ctx,loop;

function startSnake(){
document.getElementById("snake").style.display="flex";
let c=document.querySelector("canvas");
ctx=c.getContext("2d");

snake=[{x:10,y:10}];
dir={x:1,y:0};
food={x:5,y:5};

loop=setInterval(game,120);
}

function game(){
let head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};

if(head.x<0||head.y<0||head.x>19||head.y>19) return reset();

snake.unshift(head);

if(head.x==food.x&&head.y==food.y){
food={x:Math.random()*20|0,y:Math.random()*20|0};
}else snake.pop();

ctx.clearRect(0,0,400,400);

ctx.fillStyle="#2ea043";
snake.forEach(s=>ctx.fillRect(s.x*20,s.y*20,18,18));

ctx.fillStyle="red";
ctx.fillRect(food.x*20,food.y*20,18,18);
}

function reset(){
clearInterval(loop);
startSnake();
}

function closeSnake(){
clearInterval(loop);
document.getElementById("snake").style.display="none";
}

/* init */
slider.style.left="50%";
before.style.width="50%";
</script>

</body>
</html>
